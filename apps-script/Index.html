<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1f2937; }
    h1 { font-size: 1.4rem; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #e5e7eb; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .tab-btn { padding: 0.5rem 1rem; border: 1px solid #d1d5db; background: #f9fafb; cursor: pointer; border-radius: 6px; }
    .tab-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    label { display: block; margin-top: 0.75rem; font-weight: 600; }
    input, select { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 6px; }
    button[type=submit] { margin-top: 1rem; padding: 0.6rem 1.2rem; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button[type=submit]:disabled { opacity: 0.6; cursor: default; }
    .msg { margin-top: 1rem; padding: 0.6rem; border-radius: 6px; display: none; }
    .msg.ok { background: #dcfce7; color: #166534; display: block; }
    .msg.error { background: #fee2e2; color: #991b1b; display: block; }
  </style>
</head>
<body>
  <h1>📖 Bibliotech</h1>
  <p>Catálogo digital de la biblioteca. Consultá los libros disponibles o pedí un préstamo.</p>

  <div class="tabs">
    <button type="button" class="tab-btn active" data-tab="catalogo">📚 Catálogo</button>
    <button type="button" class="tab-btn" data-tab="prestamo">🙋 Solicitar préstamo</button>
  </div>

  <div id="catalogo" class="tab-content active">
    <table id="tabla-libros">
      <thead><tr><th>Título</th><th>Autor</th><th>Disponibles</th></tr></thead>
      <tbody><tr><td colspan="3">Cargando...</td></tr></tbody>
    </table>
  </div>

  <div id="prestamo" class="tab-content">
    <form id="form-prestamo">
      <label for="nombre">Nombre y apellido</label>
      <input type="text" id="nombre" required>

      <label for="curso">Curso</label>
      <select id="curso" required>
        <option value="1ro">1ro</option>
        <option value="2do">2do</option>
        <option value="3ro">3ro</option>
        <option value="4to">4to</option>
        <option value="5to">5to</option>
        <option value="6to">6to</option>
      </select>

      <label for="libro">Libro</label>
      <select id="libro" required>
        <option value="" disabled selected>Elegí un libro...</option>
      </select>

      <button type="submit" id="btn-confirmar">Confirmar reserva</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(btn.dataset.tab).classList.add('active');
        btn.classList.add('active');
      });
    });

    function cargarCatalogo() {
      google.script.run.withSuccessHandler(renderCatalogo).getCatalogo();
    }

    function renderCatalogo(libros) {
      const tbody = document.querySelector('#tabla-libros tbody');
      const select = document.getElementById('libro');

      tbody.innerHTML = libros.length
        ? libros.map(l => `<tr><td>${l.titulo}</td><td>${l.autor}</td><td>${l.disponibles}</td></tr>`).join('')
        : '<tr><td colspan="3">No hay libros disponibles.</td></tr>';

      select.innerHTML = '<option value="" disabled selected>Elegí un libro...</option>' +
        libros.map(l => `<option value="${l.titulo}">${l.titulo}</option>`).join('');
    }

    document.getElementById('form-prestamo').addEventListener('submit', function (e) {
      e.preventDefault();
      const boton = document.getElementById('btn-confirmar');
      const msg = document.getElementById('msg');
      const datos = {
        nombre: document.getElementById('nombre').value,
        curso: document.getElementById('curso').value,
        libro: document.getElementById('libro').value
      };

      boton.disabled = true;
      msg.className = 'msg';
      msg.textContent = '';

      google.script.run
        .withSuccessHandler(function (res) {
          boton.disabled = false;
          if (res.ok) {
            msg.textContent = '✅ ¡Listo! Tu solicitud fue registrada.';
            msg.className = 'msg ok';
            document.getElementById('form-prestamo').reset();
            cargarCatalogo();
          } else {
            msg.textContent = '❌ ' + res.error;
            msg.className = 'msg error';
          }
        })
        .withFailureHandler(function (err) {
          boton.disabled = false;
          msg.textContent = '❌ Error inesperado: ' + err.message;
          msg.className = 'msg error';
        })
        .registrarPrestamo(datos);
    });

    cargarCatalogo();
  </script>
</body>
</html>
